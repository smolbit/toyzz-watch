name: Diag
on:
  push:
    branches: [main]
    paths: [diag.py, .github/workflows/diag.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python diag.py
      - run: |
          git config user.name "toyzz-bot"
          git config user.email "toyzz-bot@users.noreply.github.com"
          git add diag.txt && git commit -q -m diag && git pull -q --rebase && git push -q
