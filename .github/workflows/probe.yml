name: Probe
on:
  push:
    branches: [main]
    paths: [probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe.py
      - if: always()
        run: |
          git config user.name "toyzz-bot"
          git config user.email "toyzz-bot@users.noreply.github.com"
          git add probe.txt && git commit -m "probe" && git pull --rebase -q && git push
