name: Toyzz Hot Wheels Watch

# Her calisma: 1 kez tarar -> 30 dk bekler -> bir sonrakini baslatir (zincir).
# GitHub'in kendi zamanlayicisi bu repoda tetiklenmedigi icin zincir kullaniliyor;
# cron sadece zincir koparsa yedek.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [toyzz_watch.py, .github/workflows/watch.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: toyzz-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Tara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TEST: ${{ github.event_name == 'push' && '1' || '' }}
        run: python toyzz_watch.py || echo "tarama hatasi"

      - name: Durumu kaydet
        run: |
          git config user.name "toyzz-bot"
          git config user.email "toyzz-bot@users.noreply.github.com"
          for f in seen.json catalog.txt tg_status.txt heartbeat.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -q -m "durum guncellendi" && git pull -q --rebase && git push -q) || true

      - name: 30 dk bekle
        run: sleep ${{ github.event_name == 'push' && '20' || '1800' }}

      - name: Sonraki taramayi baslat
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main
