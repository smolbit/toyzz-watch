name: Toyzz Hot Wheels Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 dakikada bir (GitHub bazen geciktirir)
  workflow_dispatch:         # elle "Run workflow" ile test icin
  push:
    branches: [main]
    paths: [toyzz_watch.py, .github/workflows/watch.yml]

permissions:
  contents: write

concurrency:
  group: toyzz-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Tara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python toyzz_watch.py

      - name: Durumu kaydet
        run: |
          git config user.name "toyzz-bot"
          git config user.email "toyzz-bot@users.noreply.github.com"
          git add seen.json catalog.txt
          git diff --cached --quiet || (git commit -m "durum guncellendi" && git pull --rebase -q && git push)
