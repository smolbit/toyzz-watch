name: Toyzz Hot Wheels Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 dakikada bir (GitHub bazen geciktirir)
  workflow_dispatch:         # elle "Run workflow" ile test icin

permissions:
  contents: write

concurrency:
  group: toyzz-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4

      - name: Tara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python toyzz_watch.py

      - name: seen.json kaydet
        run: |
          git config user.name "toyzz-bot"
          git config user.email "toyzz-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen guncellendi" && git push)
