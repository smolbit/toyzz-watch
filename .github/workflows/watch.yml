name: Toyzz Hot Wheels Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 dakikada bir (GitHub bazen geciktirir)
  workflow_dispatch:         # elle "Run workflow" ile test icin
  push:
    branches: [main]
    paths-ignore: [seen.json, debug.txt, debug.html]

permissions:
  contents: write

concurrency:
  group: toyzz-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Tara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python toyzz_watch.py

      - name: seen.json kaydet
        if: always()
        run: |
          git config user.name "toyzz-bot"
          git config user.email "toyzz-bot@users.noreply.github.com"
          for f in seen.json debug.txt debug.html; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "seen guncellendi" && git pull --rebase -q && git push)
