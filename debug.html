        <!-- User Data -->
        <script>
            (function() {
                async function sha256(str) {
                    if (!str) return '';
                    const encoder = new TextEncoder();
                    const data = encoder.encode(str);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                    return Array.from(new Uint8Array(hashBuffer))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('');
                }

                async function sendUserDataToDataLayer() {
                    try {
                        const USER_DATA_SENT_KEY = 'toyzz_user_data_sent_early';
                        const USER_DATA_LAST_SENT_KEY = 'toyzz_user_data_last_sent_early';
                        
                        const dataSent = sessionStorage.getItem(USER_DATA_SENT_KEY) === 'true';
                        if (dataSent) {
                            const hasUserData = window.dataLayer && window.dataLayer.some(item => item.event === 'user_data');
                            if (hasUserData) {
                                setTimeout(() => {
                                    if (typeof window.loadGTM === 'function' && !window.gtmLoaded) {
                                        window.loadGTM();
                                    }
                                }, 10);
                                return;
                            } else {
                                sessionStorage.removeItem(USER_DATA_SENT_KEY);
                                sessionStorage.removeItem(USER_DATA_LAST_SENT_KEY);
                            }
                        }

                        window.dataLayer = window.dataLayer || [];
                        
                        const token = localStorage.getItem('_token');
                        const isLoggedIn = !!token;
                        
                        let userData = {
                            user_id: "",
                            email_address: "",
                            sha256_email_address: "",
                            sha256_phone_number: "",
                            user_transacted: false,
                            transaction_count: 0,
                            register_date: "",
                            user_logged_in: isLoggedIn,
                            user_type: isLoggedIn ? "registered" : "guest",
                            user_lastsession_date: "",
                            user_lastpurchase_date: "",
                            opt_in_mail: "false",
                            opt_in_sms: "false"
                        };

                        if (isLoggedIn) {
                            try {
                                const userDataStr = localStorage.getItem('_user');
                                if (userDataStr) {
                                    const user = JSON.parse(userDataStr);
                                    
                                    const hashedEmail = user?.userId || "";
                                    const hashedPhone = user?.mobile_number ? await sha256(user?.mobile_number?.trim()) : "";
                                    
                                    userData = {
                                        user_id: user?.userId || "",
                                        email_address: user?.email || "",
                                        sha256_email_address: hashedEmail,
                                        sha256_phone_number: hashedPhone,
                                        user_transacted: user?.user_transacted || false,
                                        transaction_count: user?.transaction_count || 0,
                                        register_date: user?.createdate ? user.createdate.split(' ')[0].split('-').reverse().join('.') : "",
                                        user_logged_in: true,
                                        user_type: "registered",
                                        user_lastsession_date: user?.user_lastsession_date || "",
                                        user_lastpurchase_date: user?.user_lastpurchase_date || "",
                                        opt_in_mail: user?.is_email?.toString() || "false",
                                        opt_in_sms: user?.is_sms?.toString() || "false"
                                    };
                                }
                            } catch (e) {
                                console.error(e);
                            }
                        }

                        const userDataEvent = {
                            event: "user_data",
                            ...userData,
                            timestamp: Date.now()
                        };
                        
                        window.dataLayer.push(userDataEvent);

                        const currentTime = Date.now();
                        sessionStorage.setItem(USER_DATA_SENT_KEY, 'true');
                        sessionStorage.setItem(USER_DATA_LAST_SENT_KEY, currentTime.toString());
                        
                        setTimeout(() => {
                            if (typeof window.loadGTM === 'function') {
                                window.loadGTM();
                            }
                        }, 10);

                    } catch (error) {
                        console.error(error);
                        setTimeout(() => {
                            if (typeof window.loadGTM === 'function' && !window.gtmLoaded) {
                                window.loadGTM();
                            }
                        }, 100);
                    }
                }

                sendUserDataToDataLayer();

                let lastTokenState = !!localStorage.getItem('_token');
                
                function checkTokenChanges() {
                    const currentTokenState = !!localStorage.getItem('_token');
                    if (lastTokenState !== currentTokenState) {
                        lastTokenState = currentTokenState;
                        
                        sessionStorage.removeItem('toyzz_user_data_sent_early');
                        sessionStorage.removeItem('toyzz_user_data_last_sent_early');
                        
                        setTimeout(() => {
                            sendUserDataToDataLayer();
                        }, 50);
                    }
                }
                
                setInterval(checkTokenChanges, 1000);

                let lastUrl = location.href;
                const originalPushState = history.pushState;
                const originalReplaceState = history.replaceState;
                
                function detectUrlChange() {
                    if (location.href !== lastUrl) {
                        lastUrl = location.href;
                        
                        sessionStorage.removeItem('toyzz_user_data_sent_early');
                        sessionStorage.removeItem('toyzz_user_data_last_sent_early');
                        
                        setTimeout(() => {
                            sendUserDataToDataLayer();
                            
                            setTimeout(() => {
                                if (typeof window.loadGTM === 'function' && !window.gtmLoaded) {
                                    window.loadGTM();
                                }
                            }, 10);
                        }, 100);
                    }
                }
                
                history.pushState = function(...args) {
                    originalPushState.apply(history, args);
                    setTimeout(detectUrlChange, 0);
                };
                
                history.replaceState = function(...args) {
                    originalReplaceState.apply(history, args);
                    setTimeout(detectUrlChange, 0);
                };
                
                window.addEventListener('popstate', () => {
                    setTimeout(detectUrlChange, 0);
                });
            })();
        </script>

                    j.async = true;
                    j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
                    f.parentNode.insertBefore(j, f);
                    
                    window.gtmLoaded = true;
                })(window, document, "script", "dataLayer", "GTM-NSW86HV");
